#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Compose Multiplatform (PRD V1.3 附录 B：macOS 桌面目标)
#CMP 对 macOS 桌面目标仍标记为 experimental，Phase 0 声明 macosArm64 目标需显式开启
#（macosX64 已被 CMP 1.11.0 起移除，见 docs/progess/100_Phase0 多模块骨架.md「目标矩阵决策」；
#风险已在 docs/progess/000 §3 记录（CMP Desktop 成熟度 = PRD V1.3 §10 中高风险项）。
org.jetbrains.compose.experimental.macos.enabled=true
#网络（可选兜底）：本机系统代理 127.0.0.1:7890，避免 maven central 直连偶发 DNS/超时抖动
#（如无需代理环境可删除以下四行；Phase 0 实测直连偶发 000 超时，加代理后稳定 200）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
