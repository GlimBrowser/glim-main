# 子仓库清单：子目录|仓库名|说明
# 以 # 开头的行为注释；拆分顺序无关。
shared/network|glim-network|OpenAI 兼容协议、SSE 解析、错误映射
shared/agent|glim-agent|AI Agent 编排、工具 Schema、JSON 兜底链
shared/adfilter|glim-adfilter|去广告规则引擎（ABP 子集）与净化统计
shared/plugin|glim-plugin|用户脚本解析、权限模型、订阅
shared/data|glim-data|SQLDelight schema 与仓库实现
shared/window|glim-window|多窗口状态机与快捷键映射
shared/ui-adaptive|glim-ui-adaptive|窗口宽度分级与自适应布局决策
app/shared|glim-app-shared|KMP 浏览器内核抽象、Compose UI、状态管理
app/androidApp|glim-android|Android 壳（系统内核、主题、图标）
app/desktopApp|glim-desktop|桌面壳（Compose Desktop、打包）
app/webApp|glim-web|浏览器外壳（开发中，暂未启用）
app/iosApp|glim-ios|iOS 壳（系统内核、Xcode 工程）
tools|glim-tools|图标生成等开发工具
